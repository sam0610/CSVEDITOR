<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CSV 修改器">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1217" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>CSV 修改器</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen sheet. App bar, tool strip and cell editor stay put; the grid fills the rest and scrolls on its own. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FA;
  --fg:#17202C; --muted:#5C6879;
  --line:#D3D9E2; --line-soft:#E4E8EE;
  --accent:#2349C9; --accent-fg:#FFFFFF; --accent-tint:#E3E9FB; --sel-fill:#EDF2FF;
  --match:#FFEFAE; --good:#1B6B3A; --warn:#8F5200; --warn-tint:#FCEBCB; --danger:#B3261E;
  --scrim:rgba(12,16,24,.5); --toast-link:#9DB4FF;
  --font-ui:'IBM Plex Sans','PingFang HK','PingFang TC','Noto Sans HK','Microsoft JhengHei',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1217; --surface:#161B22; --surface-2:#1C222B;
    --fg:#E6EBF2; --muted:#93A0B3;
    --line:#2C3541; --line-soft:#222A34;
    --accent:#8CA6FF; --accent-fg:#0B1224; --accent-tint:#222D4C; --sel-fill:#1E2A4A;
    --match:#4B4219; --good:#7FD39B; --warn:#F0B35C; --warn-tint:#3A2D12; --danger:#FF8F86;
    --scrim:rgba(0,0,0,.6); --toast-link:#2349C9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1217; --surface:#161B22; --surface-2:#1C222B;
  --fg:#E6EBF2; --muted:#93A0B3;
  --line:#2C3541; --line-soft:#222A34;
  --accent:#8CA6FF; --accent-fg:#0B1224; --accent-tint:#222D4C; --sel-fill:#1E2A4A;
  --match:#4B4219; --good:#7FD39B; --warn:#F0B35C; --warn-tint:#3A2D12; --danger:#FF8F86;
  --scrim:rgba(0,0,0,.6); --toast-link:#2349C9;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui);-webkit-text-size-adjust:100%}
button,input,textarea{font-family:inherit}
button,label.btn,th,td{touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{height:100%;display:flex;flex-direction:column;gap:6px;
  padding-block:6px;
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px)}


/* app bar */
.bar{display:flex;align-items:center;gap:8px;min-height:48px}
.file{flex:1;min-width:0}
.fname{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;min-width:0}
.fname .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badge{flex:none;font-size:11px;font-weight:500;letter-spacing:.05em;padding:2px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);white-space:nowrap}
.badge.warn{background:var(--warn-tint);color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font:12px var(--font-mono);color:var(--muted)}
.encw{position:relative}
.lnk{border:0;background:none;padding:2px 0;color:var(--accent);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:disabled{color:var(--muted);text-decoration:none;cursor:default}
.menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:220px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.2);display:flex;flex-direction:column}
.menu button{border:0;background:none;color:var(--fg);text-align:left;font:14px var(--font-ui);padding:10px 12px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.menu button[aria-checked="true"]{color:var(--accent);font-weight:600}
.menu button:hover{background:var(--surface-2)}

.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--font-ui);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.btn:focus-within,.tb:focus-visible,.nav:focus-visible,.seg button:focus-visible,.lnk:focus-visible,.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* status bar */
.sbar{flex:none;display:flex;align-items:center;height:28px;padding:0 4px;background:var(--surface-2);border:solid var(--line);border-width:1px 0;border-radius:0;font:12px var(--font-mono);color:var(--muted);white-space:nowrap;overflow:hidden}
.sbar .sg{display:inline-flex;align-items:center;gap:6px;height:100%;padding:0 10px;border-right:1px solid var(--line-soft);min-width:0}
.sbar .sg:last-child{border-right:0}
.sbar .sp{flex:1;min-width:0}
.sbar b{font-weight:500;color:var(--fg)}
.sbar select{font:inherit;color:var(--muted);background:transparent;border:0;border-radius:4px;padding:2px 2px;margin-left:-4px;cursor:pointer}
.sbar select:hover{background:var(--line-soft);color:var(--fg)}
.sbar select:focus-visible{outline:2px solid var(--accent,currentColor)}
.sbar .ok{color:var(--good)}
.sbar .warnc{color:var(--warn)}

/* menu bar */
.bar.mbar{min-height:38px;gap:4px;padding:0 8px;background:var(--surface);border:solid var(--line);border-width:1px 0;border-radius:0}
.mbtn{flex:none;min-height:30px;padding:0 10px;border:0;border-radius:7px;background:none;color:var(--fg);font:500 14px var(--font-ui);cursor:pointer}
.mbtn:hover,.mbtn[aria-expanded="true"]{background:var(--surface-2)}
.mbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mbar .logo{flex:none;margin:0 4px 0 2px}
.mbar .fname{flex:1;justify-content:center;font-size:14px}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.mbar .addr{flex:none;max-width:180px;text-align:right;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
.mbar .meta{margin:0 8px 0 4px}
.mbar .btn{min-height:30px;padding:0 14px}
@media (max-width:640px){#sbSel,#sbStats,#sbDim{display:none}}
.ctx .k{margin-left:auto;padding-left:20px;font:11px var(--font-mono);color:var(--muted)}
.ctx .ck{flex:none;width:16px;text-align:center;color:var(--accent)}
.ctx .gl{padding:6px 12px 2px;font-size:11px;letter-spacing:.06em;color:var(--muted)}

/* tool strip */
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.tools::-webkit-scrollbar{display:none}
.tb{flex:none;min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:13px var(--font-ui);cursor:pointer;white-space:nowrap}
.tb:disabled{opacity:.38;cursor:default}
.tb.danger{color:var(--danger)}
.tb[aria-pressed="true"]{background:var(--accent-tint);border-color:var(--accent);color:var(--accent)}
.sep{flex:none;width:1px;margin:6px 2px;background:var(--line)}

/* find and replace */
.find{display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--surface);border:solid var(--line);border-width:1px 0;border-radius:0}
.find .line{display:flex;align-items:center;gap:6px}
.find input[type="text"]{flex:1;min-width:0;height:38px;padding:0 10px;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.find input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.find .cnt{flex:none;min-width:58px;text-align:right;font:12px var(--font-mono);color:var(--muted)}
.find .chk{font-size:13px;color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* cell editor */
.edit{padding:4px 8px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.edit .row1{display:flex;align-items:center;gap:5px;min-height:30px}
.addr{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:12px var(--font-mono);color:var(--muted)}
.addr b{color:var(--fg);font-weight:500}
.nav{flex:none;width:34px;height:30px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2);color:var(--fg);font-size:14px;cursor:pointer;padding:0}
.done{flex:none;height:30px;padding:0 10px;border:1px solid var(--accent);border-radius:6px;background:var(--accent-tint);color:var(--accent);font:500 13px var(--font-ui);cursor:pointer}
#ed{position:absolute;z-index:4;display:none;margin:0;min-height:38px;max-height:120px;resize:none;overflow:auto;padding:7px 10px;font:16px/1.35 var(--font-ui);color:var(--fg);background:var(--surface);border:2px solid var(--accent);border-radius:0;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#ed:focus{outline:none}

/* grid */
.wrap{position:relative;flex:1;min-height:0;overflow:auto;background:var(--surface);border:solid var(--line);border-width:1px 0;border-radius:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.wrap:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
table{border-collapse:separate;border-spacing:0;min-width:100%;font-size:14px}
th,td{min-width:5em;height:38px;padding:0 10px;text-align:left;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);-webkit-user-select:none;user-select:none;font-variant-numeric:tabular-nums}
.c{max-width:16em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:37px}
thead th{position:sticky;top:0;z-index:2;background:var(--surface-2);border-bottom:1px solid var(--line);font-weight:600}
th.corner,th.rn{position:sticky;left:0;z-index:1;min-width:46px;width:46px;padding:0 8px;text-align:right;background:var(--surface-2);color:var(--muted);font:12px var(--font-mono)}
thead th.corner{z-index:3}
th.hd.empty{color:var(--muted);font-weight:400}
th.letter{text-align:center;color:var(--muted);font:500 12px var(--font-mono)}
th.rn.on,thead th.on{background:var(--accent-tint);color:var(--accent)}
th.m,td.m{background:var(--match)}
td.sel{background:var(--sel-fill);outline:2px solid var(--accent);outline-offset:-2px}
thead th.sel{background:var(--accent-tint);color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
table{-webkit-touch-callout:none}
.ctx{position:fixed;z-index:70;min-width:168px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.25);display:flex;flex-direction:column}
.ctx[hidden]{display:none}
.ctx button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);text-align:left;font:14px var(--font-ui);padding:10px 12px;border-radius:7px;cursor:pointer}
.ctx button:hover{background:var(--surface-2)}
.ctx button:disabled{opacity:.38;cursor:default;background:none}
.ctx button.dg{color:var(--danger)}
.ctx svg{flex:none;width:16px;height:16px}
.ctx .sx{height:1px;margin:4px 6px;background:var(--line)}
td.rng{background:var(--sel-fill)}
thead th.rng{background:var(--accent-tint)}
.multi th,.multi td{touch-action:none}
td.rowsel{background:var(--sel-fill)}
td.colsel{background:var(--sel-fill)}
thead th.colsel{background:var(--accent-tint);color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px}
td.more{height:46px;text-align:center;color:var(--muted);cursor:pointer;border-right:0}
td.more.idle{cursor:default}
.kbsp{height:0}
.editing .kbsp{height:40vh}
.addc{min-width:46px;width:46px;padding:0}
td.addc{background:var(--surface-2)}
thead th.add{text-align:center}
th.addrow{height:44px}
td.addfill{height:44px;background:var(--surface-2)}
.addbtn{display:flex;align-items:center;justify-content:center;width:100%;height:100%;min-height:38px;padding:0;border:0;background:none;color:var(--accent);font:500 22px/1 var(--font-ui);cursor:pointer}
.addbtn:hover{background:var(--accent-tint)}
.addbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* start screen */
.startscr{display:none;flex:1;min-height:0;align-items:center;justify-content:center}
.app.start .startscr{display:flex}
.app.start .sbar,.app.start .bar,.app.start .tools,.app.start .find,.app.start .edit,.app.start .wrap{display:none}
.startbox{width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:28px}
.sttitle{font-size:20px;font-weight:600;letter-spacing:.04em}
.stbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.bigbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:176px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--accent);font-family:var(--font-ui);text-align:center;cursor:pointer}
.bigbtn svg{width:56px;height:56px}
.bigbtn .bt{font-size:18px;font-weight:600;color:var(--fg)}
.bigbtn .bs{font-size:12px;color:var(--muted)}
.bigbtn:hover{border-color:var(--accent)}
.bigbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim)}
.sheet{width:100%;max-width:520px;max-height:94%;overflow:auto;display:flex;flex-direction:column;gap:14px;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 0 0}
.sheet:focus{outline:none}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet h2{margin:0;font-size:17px;font-weight:600}
.sheet .head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--muted)}
.field input[type="text"]{width:100%;height:42px;padding:0 12px;font-size:16px;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.field input[type="text"]:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
.hint{font-size:12px;color:var(--muted)}
.hint code{font:12px var(--font-mono);color:var(--fg)}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;min-height:40px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 14px var(--font-ui);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
pre.pv{margin:0;padding:10px 12px;max-width:100%;overflow-x:auto;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:8px;font:12px/1.55 var(--font-mono);color:var(--fg)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:130px}
.status{min-height:20px;font-size:13px;color:var(--muted)}
#pasteTa{width:100%;height:160px;padding:8px 10px;font:16px/1.5 var(--font-mono);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
#fb{width:100%;height:120px;padding:8px 10px;font:12px/1.5 var(--font-mono);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;max-width:calc(100% - 32px);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast button{border:0;background:none;padding:4px 6px;color:var(--toast-link);font:600 14px var(--font-ui);cursor:pointer}

@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app">
  <h1 class="sr">CSV 修改器</h1>

  <header class="bar mbar">
    <svg class="logo" width="22" height="22" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#F5A524"></rect><rect x="13" y="13" width="38" height="38" rx="7" fill="none" stroke="#17202C" stroke-opacity="0.35" stroke-width="2.4"></rect><circle cx="33" cy="27.5" r="6.2" fill="#17202C"></circle><path d="M33 33.5C33.6 40 30.5 44.4 24.5 46.4" fill="none" stroke="#17202C" stroke-width="6" stroke-linecap="round"></path></svg>
    <button class="mbtn" type="button" data-menu="file" aria-haspopup="menu" aria-expanded="false">檔案</button>
    <button class="mbtn" type="button" data-menu="edit" aria-haspopup="menu" aria-expanded="false">編輯</button>
    <button class="mbtn" type="button" data-menu="view" aria-haspopup="menu" aria-expanded="false">檢視</button>
    <div class="fname"><span class="t" id="fn"></span><span class="dot" id="bDirty" hidden title="未儲存"></span></div>
    <input class="sr" type="file" id="file" accept=".csv,.tsv,.txt,text/csv,text/plain,application/vnd.ms-excel">
    <button class="btn primary" id="saveMain" type="button">儲存</button>
  </header>

  <section class="find" id="findPanel" hidden>
    <div class="line">
      <input type="text" id="find" placeholder="尋找" aria-label="尋找" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="tb" id="fPrev" type="button" aria-label="上一個">↑</button>
      <button class="tb" id="fNext" type="button" aria-label="下一個">↓</button>
      <span class="cnt" id="fCnt"></span>
      <button class="tb" id="fClose" type="button" aria-label="關閉尋找">✕</button>
    </div>
    <div class="line">
      <input type="text" id="rep" placeholder="取代為" aria-label="取代為" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="tb" id="fOne" type="button">取代</button>
      <button class="tb" id="fAll" type="button">全部取代</button>
    </div>
    <label class="chk"><input type="checkbox" id="onlyCol"><span class="chk" style="font-size:13px;color:var(--muted)">全部取代時只改選取的那一欄</span></label>
  </section>

  <div class="wrap" id="wrap" tabindex="0">
    <table id="tbl" aria-label="CSV 內容"></table>
    <textarea id="ed" rows="1" aria-label="儲存格內容" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <div class="kbsp"></div>
  </div>

  <footer class="sbar" id="sbar">
    <span class="sg" id="sbAddr"></span>
    <span class="sg" id="sbSel"></span>
    <span class="sg" id="sbStats" hidden><select id="sbStatSel" aria-label="統計方式"><option value="sum">總計</option><option value="avg">平均</option><option value="cnt">項目</option><option value="max">最大</option><option value="min">最小</option></select><b id="sbStatVal"></b></span>
    <span class="sp"></span>
    <span class="sg" id="sbDim"></span>
    <span class="sg" id="sbEnc"></span>
    <span class="sg" id="sbDelim"></span>
    <span class="sg" id="sbSave"></span>
    <span class="sg" id="sbVer"></span>
  </footer>

  <section class="startscr" id="start" aria-label="開始">
    <div class="startbox">
      <svg width="88" height="88" viewBox="0 0 64 64" role="img" aria-label="CSV 修改器"><rect width="64" height="64" rx="15" fill="#F5A524"></rect><rect x="13" y="13" width="38" height="38" rx="7" fill="none" stroke="#17202C" stroke-opacity="0.35" stroke-width="2.4"></rect><circle cx="33" cy="27.5" r="6.2" fill="#17202C"></circle><path d="M33 33.5C33.6 40 30.5 44.4 24.5 46.4" fill="none" stroke="#17202C" stroke-width="6" stroke-linecap="round"></path></svg>
      <div class="sttitle">CSV 修改器</div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id);};
var PAGE=400, MAX_UNDO=100, KEY='csv-xiugai-draft-v1';
var DELIMS={comma:',',semi:';',tab:'\t'};
var DELIM_NAME={',':'逗號分隔',';':'分號分隔','\t':'Tab 分隔'};

var app=$('app'), wrap=$('wrap'), tbl=$('tbl'), ed=$('ed'), sheet=$('sheet'), toastEl=$('toast');
var S=null, undoSt=[], redoSt=[], cleanSet=new WeakSet();
var sel={r:0,c:0}, internalClip=null, fileHandle=null, fsOK=!!(window.showOpenFilePicker&&window.showSaveFilePicker), mm=null, rng=null, rects=[], dragX=0, dragY=0, dragTm=0, multiAnchor=null, drag=null, colSel=false, rowSel=false, selCols=[], selRows=[], anchorC=0, anchorR=0, multi=false, lastHd=null, ctxSwallow=0, shown=PAGE, editTarget=null, composing=false, prevEls=[];
var findTerm='', matches=[], matchSet=new Set();
var dl=null, exportName='', exportFor=null, toastT=0, saveT=0;

/* ---------- helpers ---------- */
function esc(s){return s.replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function disp(v){return v.replace(/\r?\n/g,' ↵ ');}
function colName(c){var s='';c++;while(c>0){var m=(c-1)%26;s=String.fromCharCode(65+m)+s;c=Math.floor((c-1)/26);}return s;}
function getCell(r,c){var row=S.rows[r];return (row&&row[c]!==undefined)?row[c]:'';}
function seq(a,b){var o=[];for(var i=a;i<=b;i++)o.push(i);return o;}
function allRects(){return rects.concat([rng||{r1:sel.r,r2:sel.r,c1:sel.c,c2:sel.c}]);}
function uniq(a){var m={};a.forEach(function(x){m[x]=1;});return Object.keys(m).map(Number).sort(function(x,y){return x-y;});}
function rowList(){
  if(rowSel)return selRows.slice();
  if(!rng&&!rects.length)return [sel.r];
  var o=[];allRects().forEach(function(q){o=o.concat(seq(q.r1,q.r2));});return uniq(o);
}
function colList(){
  if(colSel)return selCols.slice();
  if(!rng&&!rects.length)return [sel.c];
  var o=[];allRects().forEach(function(q){o=o.concat(seq(q.c1,q.c2));});return uniq(o);
}
function commitActive(){
  if(colSel||rowSel)return;
  var q=rng?{r1:rng.r1,r2:rng.r2,c1:rng.c1,c2:rng.c2}:{r1:sel.r,r2:sel.r,c1:sel.c,c2:sel.c};
  var dup=rects.some(function(x){return x.r1===q.r1&&x.r2===q.r2&&x.c1===q.c1&&x.c2===q.c2;});
  if(!dup)rects.push(q);
}
function ctrlCell(r,c){
  commitEdit();
  var i=-1;
  rects.forEach(function(q,k){if(q.r1===q.r2&&q.c1===q.c2&&q.r1===r&&q.c1===c)i=k;});
  if(i>=0){rects.splice(i,1);applySelection(false);updateUI();return;}
  commitActive();
  select(r,c,{keep:true,noReveal:true});
}
function inAnyRect(r,c){return allRects().some(function(q){return r>=q.r1&&r<=q.r2&&c>=q.c1&&c<=q.c2;});}
function rowTargets(){var a=rowList();return S.hasHeader?a.filter(function(r){return r>0;}):a;}
function colTargets(){return colList();}
function canDelRow(){var t=rowTargets();return t.length>0&&S.rows.length-t.length>=1;}
function canDelCol(){return S.rows[0].length-colTargets().length>=1;}
function pick(list,anchor,v,mode,lo){
  var o=[],i;
  if(mode==='range'){var a=Math.max(lo,Math.min(anchor,v)),b=Math.max(anchor,v);for(i=a;i<=b;i++)o.push(i);return {list:o,anchor:anchor};}
  if(mode==='toggle'){o=list.slice();i=o.indexOf(v);if(i<0)o.push(v);else if(o.length>1)o.splice(i,1);o.sort(function(x,y){return x-y;});return {list:o,anchor:v};}
  return {list:[v],anchor:v};
}
function selectCols(c,mode){
  commitEdit();
  var p=pick(colSel?selCols:[],colSel?anchorC:sel.c,c,mode,0);
  selCols=p.list;anchorC=p.anchor;
  select(S.hasHeader?0:sel.r,c,{col:true});
}
function selectRows(r,mode){
  commitEdit();
  var lo=S.hasHeader?1:0;
  var p=pick(rowSel?selRows:[],rowSel?anchorR:Math.max(lo,sel.r),r,mode,lo);
  selRows=p.list;anchorR=p.anchor;
  select(r,sel.c,{row:true});
}
function clearSelected(){
  commitEdit();
  if(!colSel&&!rowSel&&(rng||rects.length)){
    var ch2=false,RS=allRects();
    var rows2=S.rows.map(function(row,i){
      var out=null;
      RS.forEach(function(R){
        if(i<R.r1||i>R.r2)return;
        for(var c=R.c1;c<=R.c2;c++){if((out||row)[c]!==''){if(!out)out=row.slice();out[c]='';}}
      });
      if(out){ch2=true;return out;}
      return row;
    });
    if(!ch2){toast('已經是空白。');return;}
    push(Object.assign({},S,{rows:rows2}));
    toast('已清除內容',true);
    return;
  }
  if(!colSel&&!rowSel){if(getCell(sel.r,sel.c)!=='')setCell(sel.r,sel.c,'');return;}
  var changed=false;
  var rows=S.rows.map(function(row,i){
    if(rowSel&&selRows.indexOf(i)>=0){if(row.some(function(v){return v!=='';}))changed=true;return new Array(row.length).fill('');}
    if(colSel&&!(S.hasHeader&&i===0)){
      var out=null;
      selCols.forEach(function(c){if(row[c]!==''){if(!out)out=row.slice();out[c]='';}});
      if(out){changed=true;return out;}
    }
    return row;
  });
  if(!changed){toast('已經是空白。');return;}
  push(Object.assign({},S,{rows:rows}));
  toast('已清除內容',true);
}

/* ---------- CSV in / out ---------- */
function parseCSV(text,delim){
  var rows=[],row=[],field='',i=0,inQ=false,n=text.length;
  while(i<n){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} inQ=false;i++;continue; }
      field+=ch;i++;continue;
    }
    if(ch==='"'&&field===''){inQ=true;i++;continue;}
    if(ch===delim){row.push(field);field='';i++;continue;}
    if(ch==='\r'){ if(text[i+1]==='\n')i++; row.push(field);rows.push(row);row=[];field='';i++;continue; }
    if(ch==='\n'){row.push(field);rows.push(row);row=[];field='';i++;continue;}
    field+=ch;i++;
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows;
}
function normalize(rows){
  while(rows.length>1){var l=rows[rows.length-1]; if(l.length<=1&&(l[0]===''||l[0]===undefined))rows.pop(); else break;}
  if(!rows.length)rows=[['']];
  var w=rows.reduce(function(m,r){return Math.max(m,r.length);},1);
  return rows.map(function(r){return r.length===w?r:r.concat(new Array(w-r.length).fill(''));});
}
function detectDelim(text){
  var counts={',':0,';':0,'\t':0},inQ=false,lines=0;
  for(var i=0;i<text.length&&i<6000&&lines<5;i++){
    var ch=text[i];
    if(ch==='"')inQ=!inQ;
    else if(!inQ){ if(ch==='\n')lines++; else if(counts[ch]!==undefined)counts[ch]++; }
  }
  var best=',',bc=0;
  [',',';','\t'].forEach(function(d){if(counts[d]>bc){bc=counts[d];best=d;}});
  return best;
}
function detectEol(t){return t.indexOf('\r\n')>=0?'\r\n':(t.indexOf('\n')>=0?'\n':'\r\n');}
function guessHeader(rows){
  var r=rows[0]||[];
  if(!r.length)return true;
  return !r.every(function(v){return v.trim()!==''&&!isNaN(Number(v));});
}
function decodeBuf(buf,choice){
  var bytes=new Uint8Array(buf),bom=false,text=null,label='UTF-8';
  function dec(enc,fatal){try{return new TextDecoder(enc,{fatal:fatal}).decode(bytes);}catch(e){return null;}}
  if(bytes.length>=3&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF){bom=true;bytes=bytes.subarray(3);}
  if(bytes.length>=2&&bytes[0]===0xFF&&bytes[1]===0xFE){
    var t16=dec('utf-16le',false);
    if(t16!==null)return {text:t16.replace(/^﻿/,''),bom:true,label:'UTF-16'};
  }
  if(choice==='utf-8'){text=dec('utf-8',false);label='UTF-8';}
  else if(choice==='big5'){text=dec('big5',false);label='Big5';}
  else if(choice==='gb18030'){text=dec('gb18030',false);label='GB18030';}
  else{
    text=dec('utf-8',true);label=bom?'UTF-8 BOM':'UTF-8';
    if(text===null){
      text=dec('big5',false);label='Big5';
      if(text===null){text=dec('utf-8',false);label='UTF-8';}
    }
  }
  if(text===null){text=dec('utf-8',false)||'';label='UTF-8';}
  return {text:text,bom:bom,label:label};
}
function buildCSV(rows,delim,eol){
  var q=new RegExp('["\\r\\n'+(delim==='\t'?'\\t':delim)+']');
  return rows.map(function(r){
    return r.map(function(v){return q.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(delim);
  }).join(eol)+eol;
}

/* ---------- state ---------- */
function makeState(rows,meta){
  return Object.assign({rows:rows,hasHeader:true,name:'未命名.csv',delim:',',bom:false,eol:'\r\n',enc:'UTF-8',encChoice:'auto',raw:null,sample:false},meta||{});
}
function startSel(st){return {r:(st.hasHeader&&st.rows.length>1)?1:0,c:0};}
function push(next,opts){
  undoSt.push(S);
  if(undoSt.length>MAX_UNDO)undoSt.shift();
  redoSt=[];
  S=next;
  afterChange(opts);
}
function openState(st){
  commitEdit();
  var fromStart=app.classList.contains('start');
  if(fromStart)undoSt=[];
  else{undoSt.push(S);if(undoSt.length>MAX_UNDO)undoSt.shift();}
  redoSt=[];
  app.classList.remove('start');
  S=st;cleanSet.add(S);
  shown=PAGE;sel=startSel(st);
  afterChange();
  wrap.scrollTop=0;wrap.scrollLeft=0;
  select(sel.r,sel.c,{noReveal:true});
}
function afterChange(opts){
  opts=opts||{};
  sel.r=Math.min(sel.r,S.rows.length-1);
  sel.c=Math.min(sel.c,S.rows[0].length-1);
  if(findTerm)recomputeMatches();
  if(opts.cell&&!findTerm){
    var e=els(opts.cell.r,opts.cell.c);
    if(e.cell)paintCell(e.cell,opts.cell.r,opts.cell.c,S.rows[opts.cell.r][opts.cell.c]);
  }else render();
  syncEditor();if(editing())placeEditor();updateUI();scheduleSave();
}
function undo(){
  commitEdit();
  if(!undoSt.length)return;
  redoSt.push(S);S=undoSt.pop();
  afterChange();select(sel.r,sel.c,{noReveal:true});
}
function redo(){
  commitEdit();
  if(!redoSt.length)return;
  undoSt.push(S);S=redoSt.pop();
  afterChange();select(sel.r,sel.c,{noReveal:true});
}

/* ---------- render ---------- */
function render(){
  var rows=S.rows,nc=rows[0].length,hdr=S.hasHeader;
  var h='<thead><tr><th class="corner"></th>';
  for(var c=0;c<nc;c++){
    if(hdr){
      var v=rows[0][c];
      h+='<th class="hd'+(v===''?' empty':'')+(matchSet.has(c)?' m':'')+'" data-r="0" data-c="'+c+'"><div class="c">'+esc(v===''?colName(c):disp(v))+'</div></th>';
    }else{
      h+='<th class="hd letter" data-c="'+c+'"><div class="c">'+colName(c)+'</div></th>';
    }
  }
  h+='<th class="addc add" data-add="col"><button class="addbtn" type="button" aria-label="新增一欄">+</button></th></tr></thead><tbody>';
  var start=hdr?1:0,end=Math.min(rows.length,start+shown);
  for(var r=start;r<end;r++){
    var row=rows[r];
    h+='<tr><th class="rn" data-r="'+r+'">'+(hdr?r:r+1)+'</th>';
    for(var k=0;k<nc;k++){
      h+='<td data-r="'+r+'" data-c="'+k+'"'+(matchSet.has(r*65536+k)?' class="m"':'')+'><div class="c">'+esc(disp(row[k]))+'</div></td>';
    }
    h+='<td class="addc"></td></tr>';
  }
  if(end<rows.length)h+='<tr><td class="more" colspan="'+(nc+2)+'" data-more="1">還有 '+(rows.length-end)+' 列未顯示,點擊顯示更多</td></tr>';
  else{
    if(start>=rows.length)h+='<tr><td class="more idle" colspan="'+(nc+2)+'">還沒有資料列。按下面的 + 新增。</td></tr>';
    h+='<tr><th class="rn add addrow" data-add="row"><button class="addbtn" type="button" aria-label="新增一列">+</button></th><td class="addfill" colspan="'+(nc+1)+'"></td></tr>';
  }
  h+='</tbody>';
  tbl.innerHTML=h;
  prevEls=[];
  applySelection(false);
}
function paintCell(el,r,c,v){
  var isH=S.hasHeader&&r===0,d=el.firstChild;
  if(isH&&v===''){d.textContent=colName(c);el.classList.add('empty');}
  else{d.textContent=disp(v);el.classList.remove('empty');}
}
function els(r,c){
  var hdr=S.hasHeader,ch=tbl.tHead&&tbl.tHead.rows[0]?tbl.tHead.rows[0].cells[c+1]:null;
  if(hdr&&r===0)return {cell:ch,rn:null,ch:ch};
  var bi=hdr?r-1:r,tr=tbl.tBodies[0]?tbl.tBodies[0].rows[bi]:null;
  if(!tr||!tr.cells[c+1]||tr.cells[c+1].classList.contains('more'))return {cell:null,rn:null,ch:ch};
  return {cell:tr.cells[c+1],rn:tr.cells[0],ch:ch};
}
function applySelection(reveal){
  prevEls.forEach(function(e){e.classList.remove('sel','on','colsel','rowsel','rng');});
  prevEls=[];
  var e=els(sel.r,sel.c);
  if(colSel||rowSel){
    var trs=tbl.tBodies[0]?tbl.tBodies[0].rows:[],hc=tbl.tHead?tbl.tHead.rows[0].cells:[],i;
    if(colSel)selCols.forEach(function(c){
      var h=hc[c+1];
      if(h){h.classList.add('colsel','on');prevEls.push(h);}
      for(i=0;i<trs.length;i++){
        var x=trs[i].cells[c+1];
        if(x&&!x.classList.contains('more')&&!x.classList.contains('addfill')&&trs[i].cells[0].dataset.r!==undefined){x.classList.add('colsel');prevEls.push(x);}
      }
    });
    if(rowSel)selRows.forEach(function(r){
      var tr=trs[S.hasHeader?r-1:r];
      if(!tr||tr.cells[0].dataset.r===undefined)return;
      tr.cells[0].classList.add('on');prevEls.push(tr.cells[0]);
      for(var k=1;k<tr.cells.length-1;k++){tr.cells[k].classList.add('rowsel');prevEls.push(tr.cells[k]);}
    });
    if(reveal){
      if(colSel&&hc[sel.c+1])revealEl(hc[sel.c+1]);
      else if(rowSel){var tr2=trs[S.hasHeader?sel.r-1:sel.r];if(tr2)revealEl(tr2.cells[0]);}
    }
    return;
  }
  if(rng||rects.length){
    var trs2=tbl.tBodies[0]?tbl.tBodies[0].rows:[],hc2=tbl.tHead?tbl.tHead.rows[0].cells:[];
    rects.concat(rng?[rng]:[]).forEach(function(Q){
    for(var rr=Q.r1;rr<=Q.r2;rr++){
      var rowEl;
      if(S.hasHeader&&rr===0)rowEl={cells:hc2};
      else{rowEl=trs2[S.hasHeader?rr-1:rr];if(!rowEl||rowEl.cells[0].dataset.r===undefined)continue;}
      for(var cc=Q.c1;cc<=Q.c2;cc++){var xe=rowEl.cells[cc+1];if(xe){xe.classList.add('rng');prevEls.push(xe);}}
    }
    });
  }
  if(e.cell){e.cell.classList.add('sel');prevEls.push(e.cell);}
  if(e.rn){e.rn.classList.add('on');prevEls.push(e.rn);}
  if(e.ch&&e.ch!==e.cell){e.ch.classList.add('on');prevEls.push(e.ch);}
  if(reveal&&e.cell)revealEl(e.cell);
}
function revealEl(el){
  var br=wrap.getBoundingClientRect(),er=el.getBoundingClientRect();
  var head=tbl.tHead?tbl.tHead.offsetHeight:0,left=46;
  var bottom=br.bottom;
  if(window.visualViewport)bottom=Math.min(bottom,window.visualViewport.offsetTop+window.visualViewport.height);
  var inHead=el.parentNode&&el.parentNode.parentNode&&el.parentNode.parentNode.tagName==='THEAD';
  if(!inHead){
    if(er.top<br.top+head)wrap.scrollTop-=(br.top+head-er.top);
    else if(er.bottom>bottom)wrap.scrollTop+=(er.bottom-bottom);
  }
  if(er.left<br.left+left)wrap.scrollLeft-=(br.left+left-er.left);
  else if(er.right>br.right)wrap.scrollLeft+=(er.right-br.right);
}

/* ---------- selection and editing ---------- */
function select(r,c,o){
  o=o||{};
  commitEdit();
  colSel=!!o.col;rowSel=!!o.row;
  if(!o.rng)rng=null;
  if(!o.keep)rects=[];
  if(!colSel)selCols=[];
  if(!rowSel)selRows=[];
  var nr=S.rows.length,nc=S.rows[0].length;
  r=Math.max(0,Math.min(nr-1,r));c=Math.max(0,Math.min(nc-1,c));
  sel={r:r,c:c};
  var bi=S.hasHeader?r-1:r;

function navKey(e){

  else if(k==='End'){tc=nc-1;if(ctl)tr=nr-1;}

/* ---------- drag select, copy, paste ---------- */
function setRange(ar,ac,r,c,keep){
  var nr=S.rows.length,nc=S.rows[0].length;
  ar=Math.max(0,Math.min(nr-1,ar));r=Math.max(0,Math.min(nr-1,r));
  ac=Math.max(0,Math.min(nc-1,ac));c=Math.max(0,Math.min(nc-1,c));
  if(ar===r&&ac===c){rng=null;select(ar,ac,{noReveal:true,keep:keep});return;}
  setRangeShown(r);
  rng={r1:Math.min(ar,r),r2:Math.max(ar,r),c1:Math.min(ac,c),c2:Math.max(ac,c)};
  select(ar,ac,{rng:true,noReveal:true,keep:keep});
}
function colRange(a,b){
  commitEdit();
  selCols=seq(Math.min(a,b),Math.max(a,b));anchorC=a;
  select(S.hasHeader?0:sel.r,b,{col:true,noReveal:true});
}
function rowRange(a,b){
  commitEdit();
  var lo=S.hasHeader?1:0;
  a=Math.max(lo,a);b=Math.max(lo,b);
  selRows=seq(Math.min(a,b),Math.max(a,b));anchorR=a;
  select(b,sel.c,{row:true,noReveal:true});
}
tbl.addEventListener('pointerdown',function(e){
  if(e.button!==0)return;
  if(e.pointerType==='touch'&&!multi)return;
  var t=e.target.closest('th,td');
  if(!t||!tbl.contains(t)||t.dataset.add||t.dataset.more)return;
  var k=null;
  if(t.classList.contains('hd'))k='col';
  else if(t.classList.contains('rn')&&t.dataset.r!==undefined)k='row';
  else if(t.tagName==='TD'&&t.dataset.r!==undefined)k='cell';
  if(!k)return;
  drag={k:k,r:+t.dataset.r,c:+t.dataset.c,x:e.clientX,y:e.clientY,moved:false,last:'',ctrl:e.ctrlKey||e.metaKey};
  dragX=e.clientX;dragY=e.clientY;
  clearInterval(dragTm);dragTm=setInterval(dragTick,16);
});
document.addEventListener('pointermove',function(e){
  if(!drag)return;
  dragX=e.clientX;dragY=e.clientY;
  if(!drag.moved&&Math.abs(dragX-drag.x)<6&&Math.abs(dragY-drag.y)<6)return;
  dragUpdate();
});
function dragMark(){
  if(!drag.moved){
    drag.moved=true;multiAnchor=null;
    if(drag.ctrl&&drag.k==='cell')commitActive();
  }
}
function dragUpdate(){
  if(!drag)return;
  var wr=wrap.getBoundingClientRect(),head=tbl.tHead?tbl.tHead.offsetHeight:0;
  var sx=Math.max(wr.left+50,Math.min(dragX,wr.right-4)),sy=Math.max(wr.top+head+3,Math.min(dragY,wr.bottom-4));
  var el=document.elementFromPoint(sx,sy),t=el&&el.closest?el.closest('th,td'):null;
  if(!t||!tbl.contains(t))return;
  var r=t.dataset.r!==undefined?+t.dataset.r:NaN,c=t.dataset.c!==undefined?+t.dataset.c:NaN;
  if(drag.k==='col'){
    if(isNaN(c)||(c===drag.c&&!drag.moved))return;
    if(drag.last===String(c))return;drag.last=String(c);dragMark();colRange(drag.c,c);
  }else if(drag.k==='row'){
    if(isNaN(r)||(r===drag.r&&!drag.moved))return;
    if(drag.last===String(r))return;drag.last=String(r);dragMark();rowRange(drag.r,r);
  }else{
    if(t.tagName!=='TD'||isNaN(r)||isNaN(c))return;
    if(r===drag.r&&c===drag.c&&!drag.moved)return;
    var key=r+','+c;if(drag.last===key)return;drag.last=key;dragMark();
    ed.blur();setRange(drag.r,drag.c,r,c,drag.ctrl);
  }
}
function dragTick(){
  if(!drag||!drag.moved)return;
  var wr=wrap.getBoundingClientRect(),head=tbl.tHead?tbl.tHead.offsetHeight:0,Z=40;
  function sp(d){return Math.max(2,Math.min(30,Math.round(Math.min(1.6,(Z-d)/Z)*22)));}
  var dx=0,dy=0;
  if(drag.k!=='row'){
    if(dragX<wr.left+46+Z)dx=-sp(dragX-(wr.left+46));
    else if(dragX>wr.right-Z)dx=sp(wr.right-dragX);
  }
  if(drag.k!=='col'){
    if(dragY<wr.top+head+Z)dy=-sp(dragY-(wr.top+head));
    else if(dragY>wr.bottom-Z)dy=sp(wr.bottom-dragY);
  }
  if(dx||dy){
    var bx=wrap.scrollLeft,by=wrap.scrollTop;
    wrap.scrollLeft=bx+dx;wrap.scrollTop=by+dy;
    if(dy>0&&wrap.scrollTop===by&&tbl.querySelector('td.more[data-more]')){
      var keep=wrap.scrollTop;shown+=PAGE;render();wrap.scrollTop=keep;
    }
  }

function selIndexes(){

  if(rng)return {rows:seq(rng.r1,rng.r2),cols:seq(rng.c1,rng.c2)};
  if(rowSel)return {rows:selRows.slice(),cols:seq(0,nc-1)};
  if(colSel)return {rows:seq(0,nr-1),cols:selCols.slice()};
  return {rows:[sel.r],cols:[sel.c]};
}

function copySel(){
  commitEdit();

  var text=copyText(),ix=selIndexes();
  internalClip=text;
  var msg='已複製 '+ix.rows.length+' 列 × '+ix.cols.length+' 欄';
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;left:-9999px;top:0;font-size:16px';
      document.body.appendChild(ta);ta.select();

      toast(ok?msg:'這個環境不能複製。');
    }catch(err){toast('這個環境不能複製。');}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){toast(msg);}).catch(fallback);
  }else fallback();
}
function doPaste(tx){
  commitEdit();
  if(tx==null||tx==='')return;
  var d=normalize(parseCSV(tx,'\t'));
  var pr=d.length,pc=d[0].length;
  var r0,c0;
  if(rng){r0=rng.r1;c0=rng.c1;}
  else if(rowSel){r0=Math.min.apply(null,selRows);c0=0;}
  else if(colSel){r0=(S.hasHeader&&S.rows.length>1)?1:0;c0=Math.min.apply(null,selCols);}
  else{r0=sel.r;c0=sel.c;}
  var rows=S.rows.map(function(r){return r.slice();});
  var nc=rows[0].length;
  var fill=(pr===1&&pc===1&&(rng||rects.length));
  var endR,endC;
  if(fill){
    allRects().forEach(function(Q){for(var r=Q.r1;r<=Q.r2;r++)for(var c=Q.c1;c<=Q.c2;c++)rows[r][c]=d[0][0];});
    endR=r0;endC=c0;
  }else{
    var needC=Math.max(nc,c0+pc),needR=Math.max(rows.length,r0+pr);
    if(needC>nc)rows.forEach(function(row){while(row.length<needC)row.push('');});
    while(rows.length<needR)rows.push(new Array(needC).fill(''));
    for(var i=0;i<pr;i++)for(var j=0;j<pc;j++)rows[r0+i][c0+j]=d[i][j];
    endR=r0+pr-1;endC=c0+pc-1;
  }
  push(Object.assign({},S,{rows:rows}));
  multiAnchor=null;
  if(fill){toast('已填入',true);return;}
  setRange(r0,c0,endR,endC);
  toast('已貼上 '+(endR-r0+1)+' 列 × '+(endC-c0+1)+' 欄',true);
}

}

/* ---------- find and replace ---------- */
function recomputeMatches(){
  matches=[];matchSet=new Set();
  if(!findTerm)return;
  var t=findTerm.toLowerCase(),rows=S.rows;
  for(var r=0;r<rows.length;r++){
    var row=rows[r];
    for(var c=0;c<row.length;c++){
      if(row[c].toLowerCase().indexOf(t)>=0){var k=r*65536+c;matches.push(k);matchSet.add(k);}
    }
  }
}
function gotoMatch(dir){
  if(!matches.length)return;
  var cur=sel.r*65536+sel.c,k,i;
  if(dir>0){
    for(i=0;i<matches.length;i++){if(matches[i]>cur){k=matches[i];break;}}
    if(k===undefined)k=matches[0];
  }else{
    for(i=matches.length-1;i>=0;i--){if(matches[i]<cur){k=matches[i];break;}}
    if(k===undefined)k=matches[matches.length-1];
  }
  select(Math.floor(k/65536),k%65536);
}
function findRe(){return new RegExp(findTerm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');}
function replaceOne(){
  commitEdit();
  if(!findTerm)return;
  if(!matchSet.has(sel.r*65536+sel.c)){gotoMatch(1);return;}
  var rep=$('rep').value,v=getCell(sel.r,sel.c);
  setCell(sel.r,sel.c,v.replace(findRe(),function(){return rep;}));
  gotoMatch(1);
}
function replaceAll(){
  commitEdit();
  if(!findTerm)return;
  var re=findRe(),rep=$('rep').value,only=$('onlyCol').checked?sel.c:-1,count=0;
  var rows=S.rows.map(function(row){
    var out=null;
    for(var c=0;c<row.length;c++){
      if(only>=0&&c!==only)continue;
      var m=row[c].match(re);
      if(m){count+=m.length;if(!out)out=row.slice();out[c]=row[c].replace(re,function(){return rep;});}
    }
    return out||row;
  });
  if(!count){toast('沒有符合的內容。');return;}
  push(Object.assign({},S,{rows:rows}));
  toast('已取代 '+count+' 處',true);
}
function toggleFind(open){
  var p=$('findPanel');
  if(open===undefined)open=p.hidden;
  p.hidden=!open;
  if(open){$('find').focus();$('find').select();}
  else{findTerm='';$('find').value='';recomputeMatches();render();updateUI();}
}
$('fClose').addEventListener('click',function(){toggleFind(false);});
$('find').addEventListener('input',function(){
  findTerm=$('find').value;recomputeMatches();render();updateUI();
});
$('find').addEventListener('keydown',function(e){
  if(e.key==='Enter'){e.preventDefault();gotoMatch(e.shiftKey?-1:1);}
  else if(e.key==='Escape'){e.preventDefault();toggleFind(false);}
});

$('fNext').addEventListener('click',function(){commitEdit();gotoMatch(1);});

function numOf(v){
  if(v==null)return null;
  var s=String(v).trim().replace(/,/g,'');
  if(s===''||!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))return null;
  return Number(s);
}
function fmtN(x,d){return x.toLocaleString('en-US',{maximumFractionDigits:d});}
var statM=null;
function statMode(){if(!statM){var m='sum';try{m=localStorage.getItem('csvStat')||'sum';}catch(e){}statM=/^(sum|avg|cnt|max|min)$/.test(m)?m:'sum';}return statM;}
$('sbStatSel').addEventListener('change',function(){statM=this.value;try{localStorage.setItem('csvStat',statM);}catch(e){}updateStatus();});
function updateStatus(){
  $('sbVer').textContent='v'+APP_VERSION;
  var rows=S.rows,nr=rows.length,nc=rows[0].length,hdr=S.hasHeader;
  function rl(r){return hdr?(r===0?'標題':String(r)):String(r+1);}
  var rs,cs,addr,seltxt='',cellsN=1;
  if(rowSel){rs=selRows.slice();cs=seq(0,nc-1);}
  else if(colSel){rs=seq(0,nr-1);cs=selCols.slice();}
  else if(rects.length||rng){rs=null;}
  else{rs=[sel.r];cs=[sel.c];}
  if(rowSel){
    addr=selRows.length>1?rl(selRows[0])+':'+rl(selRows[selRows.length-1]):'第 '+rl(sel.r)+' 列';
    seltxt=selRows.length>1?'已選 '+selRows.length+' 列':'整列';
  }else if(colSel){
    addr=selCols.length>1?colName(selCols[0])+':'+colName(selCols[selCols.length-1]):colName(sel.c)+' 欄';
    seltxt=selCols.length>1?'已選 '+selCols.length+' 欄':(hdr&&rows[0][sel.c]!==''?rows[0][sel.c]:'整欄');
  }else if(rects.length){
    addr=colName(sel.c)+rl(sel.r);
    seltxt='已選 '+(rects.length+1)+' 個範圍';
  }else if(rng){
    addr=colName(rng.c1)+rl(rng.r1)+':'+colName(rng.c2)+rl(rng.r2);
    seltxt='已選 '+(rng.r2-rng.r1+1)+' 列 × '+(rng.c2-rng.c1+1)+' 欄';
  }else{
    addr=colName(sel.c)+rl(sel.r);
    seltxt=(hdr&&sel.r>0&&rows[0][sel.c]!=='')?rows[0][sel.c]:(hdr&&sel.r===0?'標題列':'');
  }
  var cnt=0,sum=0,total=0,seen=null,i,j,maxv=-Infinity,minv=Infinity;
  function add(r,c){
    total++;
    var x=numOf(rows[r]&&rows[r][c]);
    if(x!==null){cnt++;sum+=x;if(x>maxv)maxv=x;if(x<minv)minv=x;}
  }
  if(rects.length){
    seen={};
    allRects().forEach(function(Q){for(i=Q.r1;i<=Q.r2;i++)for(j=Q.c1;j<=Q.c2;j++){var k=i*65536+j;if(!seen[k]){seen[k]=1;add(i,j);}}});
  }else if(rng){
    for(i=rng.r1;i<=rng.r2;i++)for(j=rng.c1;j<=rng.c2;j++)add(i,j);
  }else if(rs){
    rs.forEach(function(r){cs.forEach(function(c){add(r,c);});});
  }
  var st=$('sbStats');
  if(total>=2&&cnt>=1){
    var m=statMode(),v;
    if(m==='cnt')v=fmtN(cnt,0);
    else if(m==='avg')v=fmtN(sum/cnt,2);
    else if(m==='max')v=fmtN(maxv,4);
    else if(m==='min')v=fmtN(minv,4);
    else v=fmtN(sum,4);
    $('sbStatSel').value=m;
    $('sbStatVal').textContent=v;
    st.hidden=false;
  }else st.hidden=true;
  $('sbAddr').innerHTML='<b>'+esc(addr)+'</b>';
  $('sbSel').textContent=seltxt;
  $('sbSel').hidden=!seltxt;
  $('sbDim').textContent=(hdr?(nr-1)+' 列資料':nr+' 列')+' × '+nc+' 欄';
  $('sbEnc').textContent=S.enc;
  $('sbDelim').textContent=DELIM_NAME[S.delim]||'';
  var sv=$('sbSave');
  if(!cleanSet.has(S)){sv.textContent='● 未儲存';sv.className='sg warnc';}
  else if(!fileHandle&&S.name==='未命名.csv'){sv.textContent='新檔案';sv.className='sg';}
  else{sv.textContent='✓ 已儲存';sv.className='sg ok';}
}
function updateUI(){
  var rows=S.rows,nc=rows[0].length,hdr=S.hasHeader;
  $('fn').textContent=S.name;
  $('bDirty').hidden=cleanSet.has(S);
  updateStatus();
  var cnt='';
  if(findTerm){
    if(!matches.length)cnt='沒有符合';
    else{var i=matches.indexOf(sel.r*65536+sel.c);cnt=(i>=0?(i+1)+' / ':'')+matches.length+(i>=0?'':' 處');}
  }
  $('fCnt').textContent=cnt;
}

/* ---------- open file ---------- */
function readFile(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){res(fr.result);};
    fr.onerror=function(){rej(fr.error);};
    fr.readAsArrayBuffer(file);
  });
}
function blankState(){
  var rows=[];
  for(var i=0;i<5;i++)rows.push(new Array(5).fill(''));
  return makeState(rows,{name:'未命名.csv',hasHeader:false,delim:',',eol:'\r\n',enc:'UTF-8',bom:true});
}

function loadBuffer(buf,name,choice){

  var rows=normalize(parseCSV(d.text,delim));
  openState(makeState(rows,{
    name:name,delim:delim,eol:detectEol(d.text),enc:d.label,encChoice:choice,raw:buf,
    bom:d.bom||/Big5|GB18030|UTF-16/.test(d.label),hasHeader:guessHeader(rows)
  }));
}

function csvText(){return (S.bom?'\ufeff':'')+buildCSV(S.rows,S.delim,S.eol);}
async function writeHandle(h){
  var w=await h.createWritable();

async function saveFile(){
  commitEdit();

  try{

function openSheet(){
  commitEdit();closeMenu();
  if(exportFor!==S.name){exportName=defaultOut(S.name);exportFor=S.name;}
  $('fname').value=exportName;
  $('fb').hidden=true;setStatus('');
  $('saveBtn').hidden=!dl;
  $('noSave').hidden=!!dl;
  refreshSheet();
  sheet.hidden=false;
  $('sheetBox').focus();
}
function closeSheet(){sheet.hidden=true;}
$('sClose').addEventListener('click',closeSheet);
sheet.addEventListener('click',function(e){if(e.target===sheet)closeSheet();});
$('fname').addEventListener('input',function(){exportName=$('fname').value;refreshSheet();});
$('seg').addEventListener('click',function(e){
  var b=e.target.closest('button[data-d]');
  if(!b)return;
  S.delim=DELIMS[b.dataset.d];
  refreshSheet();updateUI();scheduleSave();
});
$('bom').addEventListener('change',function(){S.bom=$('bom').checked;scheduleSave();});
$('saveBtn').addEventListener('click',async function(){
  if(!dl)return;
  var text=buildCSV(S.rows,S.delim,S.eol);
  var name=finalName();
  try{
    await dl.save({filename:name,data:S.bom?'﻿'+text:text});
    cleanSet.add(S);updateUI();scheduleSave();
    setStatus('已送出儲存:'+name);
  }catch(err){
    var code=err&&err.code;
    if(code==='declined')setStatus('已取消。');
    else if(code==='rate_limited')setStatus('請稍等一下再試。');
    else if(code==='too_large')setStatus('檔案太大,請改用「複製內容」。');
    else setStatus('這個環境不能儲存檔案,請改用「複製內容」。');
  }
});
$('copyBtn').addEventListener('click',async function(){
  var text=buildCSV(S.rows,S.delim,'\n');
  try{
    await navigator.clipboard.writeText(text);
    $('fb').hidden=true;
    setStatus('已複製 '+S.rows.length+' 列內容。');
  }catch(err){
    var fb=$('fb');
    fb.hidden=false;fb.value=text;fb.focus();fb.select();
    setStatus('不能自動複製,請長按文字框選「全選」再拷貝。');
  }
});

/* ---------- draft kept in this browser ---------- */
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveDraft,700);}
function saveDraft(){
  try{
    var s=JSON.stringify({rows:S.rows,hasHeader:S.hasHeader,name:S.name,delim:S.delim,bom:S.bom,eol:S.eol,enc:S.enc,sample:S.sample,clean:cleanSet.has(S)});
    if(s.length>2000000){localStorage.removeItem(KEY);return;}
    localStorage.setItem(KEY,s);
  }catch(e){}
}
function restoreDraft(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return null;
    var o=JSON.parse(raw);
    if(!o||o.sample||o.clean)return null;
    if(!o||!Array.isArray(o.rows)||!o.rows.length||!o.rows.every(function(r){return Array.isArray(r)&&r.every(function(v){return typeof v==='string';});}))return null;
    var st=makeState(normalize(o.rows),{
      hasHeader:o.hasHeader!==false,name:String(o.name||'未命名.csv'),
      delim:(o.delim===';'||o.delim==='\t')?o.delim:',',bom:!!o.bom,
      eol:o.eol==='\n'?'\n':'\r\n',enc:String(o.enc||'UTF-8'),sample:!!o.sample
    });
    if(o.clean)cleanSet.add(st);
    return st;
  }catch(e){return null;}
}

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!sheet.hidden){closeSheet();return;}
    if(!mm.hidden){closeMM();return;}
    if(!ctx.hidden){closeCtx();return;}
    if(!$('pasteSheet').hidden){$('pasteSheet').hidden=true;return;}
  }
  if((e.metaKey||e.ctrlKey)&&!e.altKey){
    var k0=e.key.toLowerCase();
    if(k0==='s'){e.preventDefault();if(e.shiftKey)saveAs();else saveFile();return;}
    if(k0==='o'){e.preventDefault();openPicker();return;}
    if(k0==='f'){e.preventDefault();toggleFind(true);return;}
    var t=e.target;
    if(t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'))return;
    var k=e.key.toLowerCase();
    if(k==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();}
    else if(k==='y'){e.preventDefault();redo();}
  }
});

function nativeSave(o){
  return new Promise(function(res,rej){
    try{
      var blob=new Blob([o.data],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);a.download=o.filename;
      document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      res({status:'saved'});
    }catch(e){rej({code:'unavailable'});}
  });
}
/* ---------- boot ---------- */
(function boot(){
  var st=restoreDraft(),restored=!!st;
  if(!st){
    st=blankState();cleanSet.add(st);
    app.classList.add('start');
  }
  S=st;sel=startSel(S);
  render();syncEditor();updateUI();
  if(restored)toast('已還原上次未匯出的內容。');
  var p=window.claude&&window.claude.use?window.claude.use('downloads'):null;
  if(p&&p.then)p.then(function(d){dl=d||null;}).catch(function(){dl=null;});
  else if(!window.claude)dl={save:nativeSave};
  /* installed PWA: open CSV files handed over by the OS (file_handlers) */
  if('launchQueue' in window&&window.launchQueue.setConsumer){
    window.launchQueue.setConsumer(function(lp){
      if(!lp||!lp.files||!lp.files.length)return;
      var h=lp.files[0];
      h.getFile().then(function(f){app.classList.remove('start');return openFile(f,h);}).catch(function(){toast('讀取不到這個檔案。');});
    });
  }
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.claude){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();
})();
</script>
